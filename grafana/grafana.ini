[server]
http_port = 3000

[security]
admin_user = admin
admin_password = admin

[users]
default_language = zh-Hans
allow_sign_up = false

[auth]
disable_login_form = false

[dashboards]
default_home_dashboard_path = /var/lib/grafana/dashboards/ivd-monitoring-zh.json

[plugins]
allow_loading_unsigned_plugins = panel-plugin-piechart,panel-plugin-state-timeline

[explore]
enabled = true

[analytics]
check_for_updates = false

[log]
mode = console
level = info

[paths]
data = /var/lib/grafana/data
logs = /var/log/grafana
plugins = /var/lib/grafana/plugins
provisioning = /etc/grafana/provisioning
