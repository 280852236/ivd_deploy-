groups:
  - name: ivd_service
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "服务 {{ $labels.job }} 宕机"
          description: "目标 {{ $labels.instance }} 已停止响应超过1分钟"

      - alert: HighDiskUsage
        expr: (node_filesystem_size_bytes - node_filesystem_avail_bytes) / node_filesystem_size_bytes > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "磁盘使用率超过80%"
          description: "挂载点 {{ $labels.mountpoint }} 使用率 {{ $value | humanizePercentage }}"

      - alert: HighMemoryUsage
        expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "内存使用率超过90%"
          description: "当前使用率 {{ $value | humanizePercentage }}"

      - alert: HighRequestLatency
        expr: histogram_quantile(0.95, rate(http_request_latency_seconds_bucket[5m])) > 5
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "API P95延迟超过5秒"
          description: "端点 {{ $labels.endpoint }} P95延迟 {{ $value }}s"

      - alert: HighErrorRate
        expr: rate(http_request_count{status=~"5.."}[5m]) / rate(http_request_count[5m]) > 0.1
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "5xx错误率超过10%"
          description: "端点 {{ $labels.endpoint }} 5xx错误率 {{ $value | humanizePercentage }}"
      - alert: ContainerMemoryHigh
        expr: (container_memory_usage_bytes / container_spec_memory_limit_bytes) > 0.80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "容器内存使用超过80%"
          description: "容器 {{ $labels.name }} 内存使用率 {{ $value | humanizePercentage }}"

      - alert: ContainerMemoryCritical
        expr: (container_memory_usage_bytes / container_spec_memory_limit_bytes) > 0.90
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "容器内存使用超过90%！即将OOM"
          description: "容器 {{ $labels.name }} 内存使用率 {{ $value | humanizePercentage }}，需要立即处理"
