services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ivd_user
      POSTGRES_PASSWORD: ivd_pass
      POSTGRES_DB: ivd_fault_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ivd_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ivd_net

  redis:
    image: redis:7-alpine
    # 移除 ports 映射，避免宿主机端口冲突
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ivd_net

  go-parser:
    build:
      context: ./go-parser
      dockerfile: Dockerfile
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ivd_user
      DB_PASSWORD: ivd_pass
      DB_NAME: ivd_fault_db
      SERVER_PORT: 8082
    # 移除 ports 映射（内部通信不需要）
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ivd_net
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    command: gunicorn -w 2 -b 0.0.0.0:8081 app:app --access-logfile - --error-logfile -
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ivd_user
      DB_PASSWORD: ivd_pass
      DB_NAME: ivd_fault_db
      REDIS_URL: redis://redis:6379/0
      GO_PARSER_URL: http://go-parser:8082/parse
      SECRET_KEY: your-secret-key
      ADMIN_PASSWORD: admin123
      ANALYSIS_TTL_HOURS: 2
    volumes:
      - upload_tmp:/tmp
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      go-parser:
        condition: service_started
    networks:
      - ivd_net
    restart: unless-stopped

  worker:
    build:
      context: ./web
      dockerfile: Dockerfile
    command: celery -A celery_app worker --loglevel=info --concurrency=2
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ivd_user
      DB_PASSWORD: ivd_pass
      DB_NAME: ivd_fault_db
      REDIS_URL: redis://redis:6379/0
      GO_PARSER_URL: http://go-parser:8082/parse
      SECRET_KEY: your-secret-key
      ADMIN_PASSWORD: admin123
      ANALYSIS_TTL_HOURS: 2
    volumes:
      - upload_tmp:/tmp
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      go-parser:
        condition: service_started
    networks:
      - ivd_net
    restart: unless-stopped

volumes:
  postgres_data:
  upload_tmp:

networks:
  ivd_net:
