x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

x-web-env: &web-env
  DB_HOST: pgbouncer
  REDIS_HOST: redis
  GO_PARSER_HOST: go-parser
  DB_HOST_IP: 172.28.0.23
  REDIS_HOST_IP: 172.28.0.11
  GO_PARSER_HOST_IP: 172.28.0.12
  DB_PORT: "6432"
  DB_USER: ivd_user
  DB_PASSWORD: ${DB_PASSWORD:-ivd_pass}
  DB_NAME: ivd_fault_db
  REDIS_URL: redis://redis:6379/0
  REDIS_URL_IP: redis://172.28.0.11:6379/0
  GO_PARSER_URL: http://go-parser:8082/parse
  GO_PARSER_URL_IP: http://172.28.0.12:8082/parse
  SECRET_KEY: ${SECRET_KEY:-your-secret-key}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
  SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-super2026}
  ANALYSIS_TTL_HOURS: "2"
  MAX_CONTENT_LENGTH: "209715200"
  UPLOAD_DIR: /app/uploads
  DB_MAX_CONN: "5"

x-web-common: &web-common
  build:
    context: ./web
    dockerfile: Dockerfile
  logging: *default-logging
  depends_on:
    postgres:
      condition: service_healthy
    pgbouncer:
      condition: service_healthy
    redis:
      condition: service_healthy
    go-parser:
      condition: service_started
  volumes:
    - uploads:/app/uploads
  restart: unless-stopped

services:
  postgres:
    image: postgres:15
    logging: *default-logging
    environment:
      POSTGRES_USER: ivd_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ivd_pass}
      POSTGRES_DB: ivd_fault_db
    command: >
      postgres
      -c random_page_cost=1.1
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c shared_buffers=256MB
      -c effective_cache_size=512MB
      -c work_mem=4MB
      -c maintenance_work_mem=128MB
      -c checkpoint_completion_target=0.9
      -c effective_io_concurrency=200
      -c max_connections=50
      -c shared_preload_libraries=pg_stat_statements
      -c log_min_duration_statement=1000
      -c autovacuum_naptime=60s
      -c max_wal_size=512MB
      -c min_wal_size=128MB
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ivd_user -d ivd_fault_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    networks:
      ivd_net:
        ipv4_address: 172.28.0.10

  redis:
    image: redis:7-alpine
    logging: *default-logging
    command: redis-server --appendonly yes --maxmemory 200mb --maxmemory-policy volatile-lru --maxmemory-samples 5 --lazyfree-lazy-eviction yes --lazyfree-lazy-expire yes --rdbcompression yes --rdb-save-incremental-fsync yes
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      ivd_net:
        ipv4_address: 172.28.0.11

  pgbouncer:
    build:
      context: ./pgbouncer
      dockerfile: Dockerfile
    logging: *default-logging
    environment:
      DB_USER: ivd_user
      DB_PASSWORD: ${DB_PASSWORD:-ivd_pass}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 6432 -U ivd_user || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
    restart: unless-stopped
    networks:
      ivd_net:
        ipv4_address: 172.28.0.23

  go-parser:
    build:
      context: ./go-parser
      dockerfile: Dockerfile
    logging: *default-logging
    environment:
      DB_HOST: postgres
      DB_HOST_IP: 172.28.0.10
      DB_PORT: 5432
      DB_USER: ivd_user
      DB_PASSWORD: ${DB_PASSWORD:-ivd_pass}
      DB_NAME: ivd_fault_db
      SERVER_PORT: 8082
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8082/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    networks:
      ivd_net:
        ipv4_address: 172.28.0.12
    restart: unless-stopped

  web:
    <<: *web-common
    command: gunicorn -w 4 -k gevent -b 0.0.0.0:8081 app:app --preload --keep-alive 5 --access-logfile - --error-logfile - --timeout 120 --graceful-timeout 30 --max-requests 500 --max-requests-jitter 100
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
        reservations:
          memory: 512M
    environment:
      <<: *web-env
    networks:
      ivd_net:
        ipv4_address: 172.28.0.13

  worker:
    <<: *web-common
    command: celery -A celery_app worker --pool=gevent --concurrency=4 --loglevel=info --max-tasks-per-child=500 --heartbeat-interval=30
    healthcheck:
      test: ["CMD-SHELL", "celery -A celery_app inspect ping --timeout 5 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '2.0'
        reservations:
          memory: 256M
    environment:
      <<: *web-env
    networks:
      ivd_net:
        ipv4_address: 172.28.0.14


  beat:
    <<: *web-common
    command: celery -A celery_app beat --loglevel=info
    healthcheck:
      test: ["CMD-SHELL", "celery -A celery_app inspect ping --timeout 10 || exit 1"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
    environment:
      <<: *web-env
    networks:
      ivd_net:
        ipv4_address: 172.28.0.22

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    logging: *default-logging
    environment:
      DATA_SOURCE_NAME: "postgresql://ivd_user:cnNhJo4z1QmYgi8feCjP@postgres:5432/ivd_fault_db?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9187/metrics || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
    networks:
      ivd_net:
        ipv4_address: 172.28.0.30
    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter:latest
    logging: *default-logging
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.25'
    networks:
      ivd_net:
        ipv4_address: 172.28.0.31
    restart: unless-stopped

  db-backup:
    image: postgres:15-alpine
    logging: *default-logging
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ivd_user
      DB_PASSWORD: ${DB_PASSWORD:-ivd_pass}
      DB_NAME: ivd_fault_db
      KEEP_DAYS: "7"
    volumes:
      - ./scripts/db-backup.sh:/usr/local/bin/db-backup.sh:ro
      - ./scripts/docker-cleanup.sh:/usr/local/bin/docker-cleanup.sh:ro
      - ./scripts/container-memory-guard.sh:/usr/local/bin/container-memory-guard.sh:ro
      - db-backups:/backups
      - /var/run/docker.sock:/var/run/docker.sock
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apk add --no-cache docker-cli > /dev/null 2>&1
        echo "30 12 * * * /usr/local/bin/db-backup.sh >> /backups/backup.log 2>&1" > /etc/crontabs/root
        echo "0 14 * * 0 /usr/local/bin/docker-cleanup.sh >> /backups/docker-cleanup.log 2>&1" >> /etc/crontabs/root
        echo "*/10 * * * * /usr/local/bin/container-memory-guard.sh" >> /etc/crontabs/root
        crond -f -l 2
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
    networks:
      ivd_net:
        ipv4_address: 172.28.0.21
    restart: unless-stopped

  loki:
    image: grafana/loki:2.9.0
    logging: *default-logging
    ports:
      - "3100:3100"
    volumes:
      - ./config/loki-config.yaml:/etc/loki/loki-config.yaml
    command: -config.file=/etc/loki/loki-config.yaml
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3100/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    networks:
      ivd_net:
        ipv4_address: 172.28.0.15
    restart: unless-stopped

  promtail:
    image: grafana/promtail:2.9.0
    logging: *default-logging
    volumes:
      - promtail_data:/promtail
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./config/promtail-config.yaml:/etc/promtail/promtail-config.yaml
    command: -config.file=/etc/promtail/promtail-config.yaml
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
    networks:
      ivd_net:
        ipv4_address: 172.28.0.16
    depends_on:
      - loki
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:latest
    logging: *default-logging
    command:
      - '--path.rootfs=/host'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|rootfs/var/lib/docker/containers|rootfs/var/lib/docker/overlay2|rootfs/run/docker/netns|rootfs/var/lib/docker/aufs)($$|/)'
    pid: host
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9100/metrics || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
    restart: unless-stopped
    volumes:
      - '/:/host:ro'
    networks:
      ivd_net:
        ipv4_address: 172.28.0.17

  nginx:
    image: nginx:1.25
    logging: *default-logging
    ports:
      - "8081:80"
      - "8443:443"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./web/static:/app/static:ro
      - nginx_cache:/var/cache/nginx
    depends_on:
      - web
    healthcheck:
      test: ["CMD-SHELL", "nginx -t || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    networks:
      ivd_net:
        ipv4_address: 172.28.0.20
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    logging: *default-logging
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'
      - '--storage.tsdb.retention.size=512MB'
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./config/alert_rules.yml:/etc/prometheus/alert_rules.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9090/-/healthy || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    networks:
      ivd_net:
        ipv4_address: 172.28.0.18
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.1.0
    logging: *default-logging
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
      - GF_DEFAULT_LANGUAGE=zh-Hans
      - GF_USERS_DEFAULT_LANGUAGE=zh-Hans
      - GF_DATE_FORMATS_DEFAULT_TIMEZONE=Asia/Shanghai
      - GF_DATE_FORMATS_FULL_DATE=YYYY-MM-DD HH:mm:ss
      - GF_DATE_FORMATS_SHORT_DATE=YYYY-MM-DD
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - ./grafana/grafana.ini:/etc/grafana/grafana.ini
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    networks:
      ivd_net:
        ipv4_address: 172.28.0.19
    depends_on:
      - loki
      - prometheus
    restart: unless-stopped

volumes:
  nginx_cache:
  postgres_data:
  uploads:
  grafana_data:
  prometheus_data:
  db-backups:
  promtail_data:

networks:
  ivd_net:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16
          gateway: 172.28.0.1
