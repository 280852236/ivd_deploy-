services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ivd_user
      POSTGRES_PASSWORD: ivd_pass
      POSTGRES_DB: ivd_fault_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ivd_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      ivd_net:
        ipv4_address: 172.28.0.10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      ivd_net:
        ipv4_address: 172.28.0.11

  go-parser:
    build:
      context: ./go-parser
      dockerfile: Dockerfile
    environment:
      DB_HOST: postgres
      DB_HOST_IP: 172.28.0.10
      DB_PORT: 5432
      DB_USER: ivd_user
      DB_PASSWORD: ivd_pass
      DB_NAME: ivd_fault_db
      SERVER_PORT: 8082
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      ivd_net:
        ipv4_address: 172.28.0.12
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    command: gunicorn -w 2 -b 0.0.0.0:8081 app:app --access-logfile - --error-logfile -
    # 不再直接映射端口，由 Nginx 代理
    environment:
      # 服务名配置（优先使用，Docker DNS解析）
      DB_HOST: postgres
      REDIS_HOST: redis
      GO_PARSER_HOST: go-parser
      # 固定IP配置（fallback，当DNS失败时使用）
      DB_HOST_IP: 172.28.0.10
      REDIS_HOST_IP: 172.28.0.11
      GO_PARSER_HOST_IP: 172.28.0.12
      # 其他配置
      DB_PORT: 5432
      DB_USER: ivd_user
      DB_PASSWORD: ivd_pass
      DB_NAME: ivd_fault_db
      REDIS_URL: redis://redis:6379/0
      REDIS_URL_IP: redis://172.28.0.11:6379/0
      GO_PARSER_URL: http://go-parser:8082/parse
      GO_PARSER_URL_IP: http://172.28.0.12:8082/parse
      SECRET_KEY: your-secret-key
      ADMIN_PASSWORD: admin123
      SUPER_ADMIN_PASSWORD: super2026
      ANALYSIS_TTL_HOURS: 2
      MAX_CONTENT_LENGTH: 209715200
      UPLOAD_DIR: /app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      go-parser:
        condition: service_started
    volumes:
      - uploads:/app/uploads
    networks:
      ivd_net:
        ipv4_address: 172.28.0.13
    restart: unless-stopped

  worker:
    build:
      context: ./web
      dockerfile: Dockerfile
    command: celery -A celery_app worker --loglevel=info --concurrency=2
    environment:
      # 服务名配置（优先使用，Docker DNS解析）
      DB_HOST: postgres
      REDIS_HOST: redis
      GO_PARSER_HOST: go-parser
      # 固定IP配置（fallback，当DNS失败时使用）
      DB_HOST_IP: 172.28.0.10
      REDIS_HOST_IP: 172.28.0.11
      GO_PARSER_HOST_IP: 172.28.0.12
      # 其他配置
      DB_PORT: 5432
      DB_USER: ivd_user
      DB_PASSWORD: ivd_pass
      DB_NAME: ivd_fault_db
      REDIS_URL: redis://redis:6379/0
      REDIS_URL_IP: redis://172.28.0.11:6379/0
      GO_PARSER_URL: http://go-parser:8082/parse
      GO_PARSER_URL_IP: http://172.28.0.12:8082/parse
      SECRET_KEY: your-secret-key
      ADMIN_PASSWORD: admin123
      SUPER_ADMIN_PASSWORD: super2026
      ANALYSIS_TTL_HOURS: 2
      MAX_CONTENT_LENGTH: 209715200
      UPLOAD_DIR: /app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      go-parser:
        condition: service_started
    volumes:
      - uploads:/app/uploads
    networks:
      ivd_net:
        ipv4_address: 172.28.0.14
    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    ports:
      - "3100:3100"
    volumes:
      - ./loki-config.yaml:/etc/loki/loki-config.yaml
    command: -config.file=/etc/loki/loki-config.yaml
    networks:
      ivd_net:
        ipv4_address: 172.28.0.15

  promtail:
    image: grafana/promtail:latest
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./promtail-config.yaml:/etc/promtail/promtail-config.yaml
    command: -config.file=/etc/promtail/promtail-config.yaml
    networks:
      ivd_net:
        ipv4_address: 172.28.0.16
    depends_on:
      - loki

  node-exporter:
    image: prom/node-exporter:latest
    command:
      - '--path.rootfs=/host'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|rootfs/var/lib/docker/containers|rootfs/var/lib/docker/overlay2|rootfs/run/docker/netns|rootfs/var/lib/docker/aufs)($$|/)'
    pid: host
    restart: unless-stopped
    volumes:
      - '/:/host:ro'
    networks:
      ivd_net:
        ipv4_address: 172.28.0.17

  # 新增：Nginx 反向代理（支持HTTPS）
  nginx:
    image: nginx:latest
    ports:
      - "8081:80"               # HTTP端口（重定向到HTTPS）
      - "8443:443"              # HTTPS端口
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro  # SSL证书挂载
    depends_on:
      - web
    networks:
      ivd_net:
        ipv4_address: 172.28.0.20
    restart: unless-stopped


  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      ivd_net:
        ipv4_address: 172.28.0.18
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
      - GF_DEFAULT_LANGUAGE=zh-Hans      # 保留您的汉化设置
      - GF_USERS_DEFAULT_LANGUAGE=zh-Hans
      - GF_DATE_FORMATS_DEFAULT_TIMEZONE=Asia/Shanghai
      - GF_DATE_FORMATS_FULL_DATE=YYYY-MM-DD HH:mm:ss
      - GF_DATE_FORMATS_SHORT_DATE=YYYY-MM-DD
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - ./grafana/grafana.ini:/etc/grafana/grafana.ini   # 可选，保留您的配置文件
    networks:
      ivd_net:
        ipv4_address: 172.28.0.19
    depends_on:
      - loki
      - prometheus

volumes:
  postgres_data:
  uploads:
  grafana_data:
  prometheus_data:

networks:
  ivd_net:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16
          gateway: 172.28.0.1