<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IVD 分析报告 - 层级视图</title>
    <!-- Font Awesome 6 (已有) -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
    <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- 新增 Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/analysis.css">

</head>
<body>
<div class="app">
    <div class="topbar">
        <div>
            <h2><i class="fas fa-microscope"></i> IVD 智能分析 - 诊断报告</h2>
        </div>
        <div class="meta">
            <span id="metaSeries">-</span>
            <span id="metaModel">-</span>
            <span id="metaFile">-</span>
            <span id="metaTime">-</span>
            <select id="quickSeries" style="padding:4px 10px;border-radius:16px;border:1px solid rgba(255,255,255,0.3);background:rgba(255,255,255,0.15);color:white;font-size:0.92rem;">
                <option value="" style="background:#1e40af;color:white;">选择系列</option>
                <option value="SMART" style="background:#1e40af;color:white;">SMART系列</option>
                <option value="VENUS" style="background:#1e40af;color:white;">VENUS系列</option>
            </select>
            <select id="quickModel" style="padding:4px 10px;border-radius:16px;border:1px solid rgba(255,255,255,0.3);background:rgba(255,255,255,0.15);color:white;font-size:0.92rem;">
                <option value="" style="background:#1e40af;color:white;">选择型号</option>
            </select>
            <label style="padding:4px 12px;background:linear-gradient(135deg, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0.1) 100%);border-radius:16px;cursor:pointer;font-size:0.92rem;display:flex;align-items:center;gap:6px;border:1px solid rgba(255,255,255,0.2);">
                <i class="fas fa-upload"></i> 快速上传
                <input type="file" id="quickFile" style="display:none;" accept=".txt,.log,.md,.csv,.zip" multiple>
            </label>
            <div id="quickUploadProgress" style="display:none;width:80px;height:4px;background:rgba(255,255,255,0.2);border-radius:2px;overflow:hidden;">
                <div id="quickUploadBar" style="width:0%;height:100%;background:#38bdf8;border-radius:2px;transition:width 0.3s;"></div>
            </div>
            <a href="/"><i class="fas fa-arrow-left"></i> 返回上传</a>
        </div>
    </div>
    <div class="main">
        <div class="left-panel">
            <div class="left-header">
                <div class="search-wrapper">
                    <input type="text" id="searchInput" placeholder="搜索文件名..." oninput="filterTree()">
                    <i class="fas fa-search search-icon" onclick="document.getElementById('searchInput').focus()"></i>
                </div>
                <div class="summary-row" id="summaryRow"></div>
                <div id="uploadedInfo"></div>
            </div>
            <div class="left-tree" id="leftTree">
                <div class="empty-state"><div class="icon">⏳</div><div>加载中...</div></div>
            </div>
            <div class="left-footer" id="leftFooter"></div>
        </div>
        <div class="right-panel" id="rightPanel">
            <div class="right-placeholder" id="rightPlaceholder">
                <div style="font-size:2.5rem;">📂</div>
                <div>请从左侧选择一个文件查看详情</div>
            </div>
            <div class="right-content" id="rightContent" style="display:none;">
                <div class="right-header">
                    <div>
                        <div class="file-title" id="fileTitle">-</div>
                        <div class="file-meta" id="fileMeta">-</div>
                    </div>
                    <div style="display:flex;gap:8px;">
                        <button class="btn-modal btn-fault-cooling fault-btn" style="display:none;" onclick="openFaultModal('cooling')"><i class="fas fa-snowflake"></i> 制冷故障</button>
                        <button class="btn-modal btn-fault-sample fault-btn" style="display:none;" onclick="openFaultModal('sample')"><i class="fas fa-vial"></i> 样本空吸故障</button>
                        <button class="btn-modal btn-fault-reagent fault-btn" style="display:none;" onclick="openFaultModal('reagent')"><i class="fas fa-flask"></i> 试剂空吸故障</button>
                        <button class="btn-modal btn-fault-gripper fault-btn" style="display:none;" onclick="openFaultModal('gripper')"><i class="fas fa-hand-paper"></i> 抓手运行故障</button>
                        <button class="btn-modal" onclick="openSearchDialog()"><i class="fas fa-search"></i> 查询</button>
                        <button class="btn-modal" onclick="openFullModal()"><i class="fas fa-expand"></i> 弹窗查看全文</button>
                    </div>
                </div>
                <div class="right-body" id="rightBody"></div>
            </div>
        </div>
    </div>
</div>

<div class="modal-overlay" id="fullModal" onclick="if(event.target===this)closeFullModal()">
    <div class="modal-card">
        <div class="modal-header">
            <div class="modal-title" id="modalTitle">文件全文</div>
            <button class="modal-close" onclick="closeFullModal()"><i class="fas fa-times"></i></button>
        </div>
        <div class="modal-body" id="modalBody"></div>
    </div>
</div>

<div class="search-dialog-overlay" id="searchDialog" onmousedown="if(event.target===this)closeSearchDialog()">
    <div class="search-dialog" id="searchDialogBox">
        <div class="dialog-drag-handle" id="dialogDragHandle"></div>
        <div class="search-dialog-header">
            <div class="search-tabs">
                <button class="search-tab active" data-tab="find" onclick="switchSearchTab('find')">
                    <i class="fas fa-search"></i> 查找
                </button>
                <button class="search-tab" data-tab="replace" onclick="switchSearchTab('replace')">
                    <i class="fas fa-exchange-alt"></i> 替换
                </button>
                <button class="search-tab" data-tab="findInFiles" onclick="switchSearchTab('findInFiles')">
                    <i class="fas fa-folder-open"></i> 文件查找
                </button>
                <button class="search-tab" data-tab="mark" onclick="switchSearchTab('mark')">
                    <i class="fas fa-highlighter"></i> 标记
                </button>
            </div>
            <button class="search-close" onclick="closeSearchDialog()"><i class="fas fa-times"></i></button>
        </div>
        
        <div class="search-dialog-body">
            <div class="search-tab-content active" id="tab-find">
                <div class="search-row">
                    <label>查找内容:</label>
                    <input type="text" id="findInput" placeholder="输入查找内容..." onkeydown="if(event.key==='Enter')findNext()">
                </div>
                <div class="search-options">
                    <label class="checkbox-label">
                        <input type="checkbox" id="findRegex"> 正则表达式
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="findCaseSensitive"> 区分大小写
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="findWholeWord"> 全词匹配
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="findWrap"> 循环查找
                    </label>
                </div>
                <div class="search-buttons">
                    <button class="search-btn" onclick="findPrev()">查找上一个</button>
                    <button class="search-btn primary" onclick="findNext()">查找下一个</button>
                    <button class="search-btn" onclick="findAll()">查找全部</button>
                    <button class="search-btn" onclick="countMatches()">计数</button>
                    <button class="search-btn" onclick="highlightAll()">高亮全部</button>
                </div>
                <div class="search-results" id="findResults"></div>
            </div>
            
            <div class="search-tab-content" id="tab-replace">
                <div class="search-row">
                    <label>查找内容:</label>
                    <input type="text" id="replaceFindInput" placeholder="输入查找内容...">
                </div>
                <div class="search-row">
                    <label>替换为:</label>
                    <input type="text" id="replaceWithInput" placeholder="输入替换内容...">
                </div>
                <div class="search-options">
                    <label class="checkbox-label">
                        <input type="checkbox" id="replaceRegex"> 正则表达式
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="replaceCaseSensitive"> 区分大小写
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="replaceWholeWord"> 全词匹配
                    </label>
                </div>
                <div class="search-buttons">
                    <button class="search-btn primary" onclick="replaceNext()">替换</button>
                    <button class="search-btn" onclick="replaceAll()">替换全部</button>
                </div>
                <div class="search-results" id="replaceResults"></div>
            </div>
            
            <div class="search-tab-content" id="tab-findInFiles">
                <div class="search-row">
                    <label>查找内容:</label>
                    <input type="text" id="findInFilesInput" placeholder="输入查找内容...">
                </div>
                <div class="search-row">
                    <label>文件类型:</label>
                    <input type="text" id="filePatternInput" placeholder="*.txt, *.log, *.md" value="*">
                </div>
                <div class="search-options">
                    <label class="checkbox-label">
                        <input type="checkbox" id="findInFilesRegex"> 正则表达式
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="findInFilesCaseSensitive"> 区分大小写
                    </label>
                </div>
                <div class="search-buttons">
                    <button class="search-btn primary" onclick="findInFiles()">查找全部</button>
                </div>
                <div class="search-results" id="findInFilesResults"></div>
            </div>
            
            <div class="search-tab-content" id="tab-mark">
                <div class="search-row">
                    <label>标记内容:</label>
                    <input type="text" id="markInput" placeholder="输入要标记的内容...">
                </div>
                <div class="search-options">
                    <label class="checkbox-label">
                        <input type="checkbox" id="markRegex"> 正则表达式
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="markCaseSensitive"> 区分大小写
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="markWholeWord"> 全词匹配
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="markBookmark"> 标记书签
                    </label>
                </div>
                <div class="search-buttons">
                    <button class="search-btn primary" onclick="markAll()">标记全部</button>
                    <button class="search-btn" onclick="clearMarks()">清除标记</button>
                </div>
                <div class="search-results" id="markResults"></div>
            </div>
        </div>
        
        <div class="search-status" id="searchStatus"></div>
    </div>
</div>



<!-- 底部查询结果面板 -->
<div id="searchResultPanel">
    <div class="panel-drag-handle" id="panelDragHandle"></div>
    <div class="panel-header">
        <span class="panel-title"><i class="fas fa-search me-2"></i>查找结果</span>
        <button class="panel-close" onclick="closeResultPanel()"><i class="fas fa-times"></i></button>
    </div>
    <div class="panel-body" id="resultPanelBody"></div>
</div>


<script>
window.ANALYSIS_ID = {{ analysis_id }};
window.EMBEDDED_DATA = {{ embedded_data | safe }};
</script>
<script src="/static/js/analysis.js"></script>
</body>
</html>
